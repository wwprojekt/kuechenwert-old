name: Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_env_sync:
        description: "ENV auch ohne Änderung neu schreiben?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ENV + Redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          # Alle Supabase- und Site-URLs ebenfalls aus Secrets (NIE im Klartext im Repo!)
          SUPABASE_URL_PUB: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INVOICE_SIGN_SECRET: ${{ secrets.INVOICE_SIGN_SECRET }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PK: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          # Traumkueche-Funnel (AI-Planner)
          FAL_KEY: ${{ secrets.FAL_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REFINE_MODEL: ${{ secrets.OPENAI_REFINE_MODEL }}
          OPENAI_VISION_MODEL: ${{ secrets.OPENAI_VISION_MODEL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY_PUB: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          FORCE_SYNC: ${{ github.event.inputs.force_env_sync || 'false' }}
        run: |
          set -e

          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::DOKPLOY_API_KEY fehlt als GH-Secret. In Dokploy UI unter Settings > Profile > API/CLI generieren und dann: gh secret set DOKPLOY_API_KEY"
            exit 1
          fi

          AUTH_HDR=(-H "x-api-key: $DOKPLOY_API_KEY")

          # ---------- 1) Healthcheck (validiert API-Key) ----------
          HC_RESP=$(curl -s -w "\n%{http_code}" -X GET "$DOKPLOY_URL/api/application.one?applicationId=$APP_ID" "${AUTH_HDR[@]}")
          HC_CODE=$(echo "$HC_RESP" | tail -n1)
          HC_BODY=$(echo "$HC_RESP" | sed '$d')
          if [ "$HC_CODE" != "200" ]; then
            echo "::error::API-Key oder APP_ID invalid (HTTP $HC_CODE): $HC_BODY"
            exit 1
          fi
          echo "API auth OK"

          # ---------- 2) ENV sync ----------
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY fehlt -> ENV sync uebersprungen, nur Redeploy"
          else
            echo "$HC_BODY" | jq -r '.env // ""' > current.env
            cp current.env merged.env
            # Existing buildArgs/Secrets/createEnvFile aus aktueller App holen, da im saveEnvironment-Schema required
            CUR_BUILD_ARGS=$(echo "$HC_BODY" | jq -r '.buildArgs // ""')
            CUR_BUILD_SECRETS=$(echo "$HC_BODY" | jq -r '.buildSecrets // ""')
            CUR_CREATE_ENV_FILE=$(echo "$HC_BODY" | jq -r '.createEnvFile // false')

            declare -A NEW_VARS=(
              ["NEXT_PUBLIC_SUPABASE_URL"]="$SUPABASE_URL_PUB"
              ["NEXT_PUBLIC_SUPABASE_ANON_KEY"]="$SUPABASE_ANON_KEY"
              ["SUPABASE_SERVICE_ROLE_KEY"]="$SUPABASE_SERVICE_ROLE_KEY"
              ["CRON_SECRET"]="$CRON_SECRET"
              ["NEXT_PUBLIC_SITE_URL"]="$SITE_URL"
              ["NODE_ENV"]="production"
            )
            [ -n "$INVOICE_SIGN_SECRET" ]   && NEW_VARS["INVOICE_SIGN_SECRET"]="$INVOICE_SIGN_SECRET"
            [ -n "$RESEND_API_KEY" ]        && NEW_VARS["RESEND_API_KEY"]="$RESEND_API_KEY"
            [ -n "$RESEND_FROM_EMAIL" ]     && NEW_VARS["RESEND_FROM_EMAIL"]="$RESEND_FROM_EMAIL"
            [ -n "$STRIPE_SECRET_KEY" ]     && NEW_VARS["STRIPE_SECRET_KEY"]="$STRIPE_SECRET_KEY"
            [ -n "$STRIPE_WEBHOOK_SECRET" ] && NEW_VARS["STRIPE_WEBHOOK_SECRET"]="$STRIPE_WEBHOOK_SECRET"
            [ -n "$STRIPE_PK" ]             && NEW_VARS["NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"]="$STRIPE_PK"
            # Traumkueche-Funnel (AI-Planner) - nur setzen wenn Secret vorhanden
            [ -n "$FAL_KEY" ]                 && NEW_VARS["FAL_KEY"]="$FAL_KEY"
            [ -n "$OPENAI_API_KEY" ]          && NEW_VARS["OPENAI_API_KEY"]="$OPENAI_API_KEY"
            [ -n "$OPENAI_REFINE_MODEL" ]     && NEW_VARS["OPENAI_REFINE_MODEL"]="$OPENAI_REFINE_MODEL"
            [ -n "$OPENAI_VISION_MODEL" ]     && NEW_VARS["OPENAI_VISION_MODEL"]="$OPENAI_VISION_MODEL"
            [ -n "$TURNSTILE_SECRET_KEY" ]    && NEW_VARS["TURNSTILE_SECRET_KEY"]="$TURNSTILE_SECRET_KEY"
            [ -n "$TURNSTILE_SITE_KEY_PUB" ]  && NEW_VARS["NEXT_PUBLIC_TURNSTILE_SITE_KEY"]="$TURNSTILE_SITE_KEY_PUB"

            for KEY in "${!NEW_VARS[@]}"; do
              VAL="${NEW_VARS[$KEY]}"
              if grep -qE "^${KEY}=" merged.env; then
                ESC_VAL=$(printf '%s' "$VAL" | sed -e 's/[\/&|]/\\&/g')
                sed -i "s|^${KEY}=.*|${KEY}=${ESC_VAL}|" merged.env
              else
                printf '\n%s=%s' "$KEY" "$VAL" >> merged.env
              fi
            done
            sed -i '/./,$!d' merged.env

            if cmp -s current.env merged.env && [ "$FORCE_SYNC" != "true" ]; then
              echo "ENV unchanged, skipping saveEnvironment"
            else
              PAYLOAD=$(jq -Rs \
                --arg id "$APP_ID" \
                --arg ba "$CUR_BUILD_ARGS" \
                --arg bs "$CUR_BUILD_SECRETS" \
                --argjson cef "$CUR_CREATE_ENV_FILE" \
                '{applicationId:$id, env:., buildArgs:$ba, buildSecrets:$bs, createEnvFile:$cef}' merged.env)
              RESP=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/application.saveEnvironment" \
                -H 'Content-Type: application/json' "${AUTH_HDR[@]}" \
                -d "$PAYLOAD")
              CODE=$(echo "$RESP" | tail -n1)
              if [ "$CODE" != "200" ]; then
                echo "::error::saveEnvironment failed (HTTP $CODE): $(echo "$RESP" | sed '$d')"
                exit 1
              fi
              echo "ENV synchronisiert"
            fi
          fi

          # ---------- 3) Deploy (full build with source pull) ----------
          # Wichtig: application.deploy macht source pull + build,
          # application.redeploy startet nur Container neu mit altem Image.
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H 'Content-Type: application/json' "${AUTH_HDR[@]}" \
            -d "{\"applicationId\":\"$APP_ID\"}")
          CODE=$(echo "$RESP" | tail -n1)
          if [ "$CODE" != "200" ]; then
            echo "::error::Deploy failed (HTTP $CODE): $(echo "$RESP" | sed '$d')"
            exit 1
          fi
          echo "Deploy triggered (full build with source pull)"
