name: Dokploy ENV Sync + Redeploy

on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: "Nach Env-Update automatisch redeployen?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_EMAIL: ${{ secrets.DOKPLOY_EMAIL }}
          DOKPLOY_PASSWORD: ${{ secrets.DOKPLOY_PASSWORD }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON: ${{ secrets.CRON_SECRET }}
          PROD: ${{ secrets.PROD_BASE_URL }}
        run: |
          set -e
          missing=""
          [ -z "$DOKPLOY_URL" ]      && missing="$missing DOKPLOY_URL"
          [ -z "$DOKPLOY_EMAIL" ]    && missing="$missing DOKPLOY_EMAIL"
          [ -z "$DOKPLOY_PASSWORD" ] && missing="$missing DOKPLOY_PASSWORD"
          [ -z "$DOKPLOY_APP_ID" ]   && missing="$missing DOKPLOY_APP_ID"
          [ -z "$SRK" ]              && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$CRON" ]             && missing="$missing CRON_SECRET"
          [ -z "$PROD" ]             && missing="$missing PROD_BASE_URL"
          if [ -n "$missing" ]; then
            echo "Fehlende GitHub-Secrets:$missing"
            exit 1
          fi
          echo "All required secrets present."

      - name: Login to Dokploy
        id: login
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_EMAIL: ${{ secrets.DOKPLOY_EMAIL }}
          DOKPLOY_PASSWORD: ${{ secrets.DOKPLOY_PASSWORD }}
        run: |
          set -e
          RESP=$(curl -s -X POST "$DOKPLOY_URL/api/auth/sign-in/email" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$DOKPLOY_EMAIL\",\"password\":\"$DOKPLOY_PASSWORD\"}")
          TOKEN=$(echo "$RESP" | jq -r '.token // empty')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Login failed. Response: $RESP"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "Dokploy login OK."

      - name: Fetch current application env
        id: fetch
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          TOKEN: ${{ steps.login.outputs.token }}
        run: |
          set -e
          APP_JSON=$(curl -s -X GET "$DOKPLOY_URL/api/application.one?applicationId=$APP_ID" \
            -H "Cookie: better-auth.session_token=$TOKEN")
          CUR_ENV=$(echo "$APP_JSON" | jq -r '.env // ""')
          printf '%s' "$CUR_ENV" > current.env
          echo "Current env has $(wc -l < current.env) lines."

      - name: Build merged env file
        id: merge
        env:
          SUPABASE_URL: "https://gzqayoalwtmypndrmqes.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6cWF5b2Fsd3RteXBuZHJtcWVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxODM5ODksImV4cCI6MjA5MTc1OTk4OX0.N4xDAvaL2A2hggx8mjnwTq7YxpR_WqNptP-cBvxx-8s"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://küchenwert.de"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PK: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          set -e

          declare -A NEW_VARS=(
            ["NEXT_PUBLIC_SUPABASE_URL"]="$SUPABASE_URL"
            ["NEXT_PUBLIC_SUPABASE_ANON_KEY"]="$SUPABASE_ANON_KEY"
            ["SUPABASE_SERVICE_ROLE_KEY"]="$SUPABASE_SERVICE_ROLE_KEY"
            ["CRON_SECRET"]="$CRON_SECRET"
            ["NEXT_PUBLIC_SITE_URL"]="$SITE_URL"
          )

          [ -n "$RESEND_API_KEY" ]     && NEW_VARS["RESEND_API_KEY"]="$RESEND_API_KEY"
          [ -n "$RESEND_FROM_EMAIL" ]  && NEW_VARS["RESEND_FROM_EMAIL"]="$RESEND_FROM_EMAIL"
          [ -n "$STRIPE_SECRET_KEY" ]  && NEW_VARS["STRIPE_SECRET_KEY"]="$STRIPE_SECRET_KEY"
          [ -n "$STRIPE_WEBHOOK_SECRET" ] && NEW_VARS["STRIPE_WEBHOOK_SECRET"]="$STRIPE_WEBHOOK_SECRET"
          [ -n "$STRIPE_PK" ]          && NEW_VARS["NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"]="$STRIPE_PK"

          cp current.env merged.env

          for KEY in "${!NEW_VARS[@]}"; do
            VAL="${NEW_VARS[$KEY]}"
            if grep -qE "^${KEY}=" merged.env; then
              # escape for sed: &, /, \
              ESC_VAL=$(printf '%s' "$VAL" | sed -e 's/[\/&]/\\&/g')
              sed -i "s|^${KEY}=.*|${KEY}=${ESC_VAL}|" merged.env
              echo "Updated $KEY"
            else
              printf '\n%s=%s' "$KEY" "$VAL" >> merged.env
              echo "Added $KEY"
            fi
          done

          # strip leading/trailing blank lines
          sed -i '/./,$!d' merged.env

          echo "Merged env has $(wc -l < merged.env) lines."

      - name: Push merged env to Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          TOKEN: ${{ steps.login.outputs.token }}
        run: |
          set -e
          PAYLOAD=$(jq -Rs --arg id "$APP_ID" '{applicationId:$id, env:.}' merged.env)
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/application.saveEnvironment" \
            -H 'Content-Type: application/json' \
            -H "Cookie: better-auth.session_token=$TOKEN" \
            -d "$PAYLOAD")
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -n1)
          echo "HTTP $CODE"
          echo "Body: $BODY"
          if [ "$CODE" != "200" ]; then
            echo "saveEnvironment failed."
            exit 1
          fi
          echo "Dokploy env updated."

      - name: Redeploy application
        if: github.event.inputs.redeploy == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          TOKEN: ${{ steps.login.outputs.token }}
        run: |
          set -e
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$DOKPLOY_URL/api/application.redeploy" \
            -H 'Content-Type: application/json' \
            -H "Cookie: better-auth.session_token=$TOKEN" \
            -d "{\"applicationId\":\"$APP_ID\"}")
          CODE=$(echo "$RESP" | tail -n1)
          echo "Redeploy HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Redeploy failed."
            exit 1
          fi
          echo "Redeploy triggered."
